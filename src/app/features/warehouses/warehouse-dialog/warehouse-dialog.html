<form [formRoot]="warehouseForm">
  <h2 mat-dialog-title>{{ title() }}</h2>

  <mat-dialog-content class="form-grid">
    <mat-form-field appearance="outline">
      <mat-label>Название</mat-label>
      <input matInput type="text" [formField]="warehouseForm.name" />

      @if (warehouseForm.name().touched() && warehouseForm.name().invalid()) {
        <mat-error>{{ warehouseForm.name().errors()[0]?.message }}</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Адрес</mat-label>
      <input matInput type="text" [formField]="warehouseForm.address" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Контактный телефон</mat-label>
      <input matInput type="tel" [formField]="warehouseForm.contactPhone" />
    </mat-form-field>

    @if (error()) {
      <div class="form-error" role="alert">{{ error() }}</div>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button matButton type="button" (click)="cancel()">Отмена</button>
    <button
      matButton="filled"
      type="submit"
      [disabled]="warehouseForm().submitting()"
      [showProgress]="warehouseForm().submitting()"
    >
      Сохранить
      <mat-progress-spinner
        progressIndicator
        diameter="20"
        mode="indeterminate"
      />
    </button>
  </mat-dialog-actions>
</form>
